# Base de donnees MySQL (port personnalise 4490)
spring.datasource.url=jdbc:mysql://localhost:4490/gestion_stock?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Serveur
server.port=8080

# JWT (a remplacer par une cle longue et aleatoire en production)
jwt.secret=cleSecreteDeDeveloppementAChangerEnProductionRemplacezMoi123456
jwt.expiration=86400000
